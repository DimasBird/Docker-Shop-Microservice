name: shop

services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8080:8000"
    env_file: .env
    depends_on:
      firewall_redis:
        condition: service_healthy
      firewall_postgres_shop:
        condition: service_healthy
      postgres_shop:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend
      - shop_cache
      - shop_api_backend

  consumer:
    build: .
    command: python -m app.messaging.consumer
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - consumer_backend

  postgres_shop:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SHOP_SERVICE_PASSWORD: ${SHOP_SERVICE_PASSWORD}
    volumes:
      - shop_postgres_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - shop_api_backend

  postgres_shop_standby:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -s "$$PGDATA/PG_VERSION" ]; then
          export PGPASSWORD='ReplicaPass2026!'
          pg_basebackup -h postgres_shop -p 5432 -U replicator -D "$$PGDATA" -Fp -Xs -P -R
        fi
        exec docker-entrypoint.sh postgres
    volumes:
      - shop_postgres_standby_data2:/var/lib/postgresql/data
    depends_on:
      postgres_shop:
        condition: service_healthy
      firewall_postgres_shop:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - shop_api_backend

  postgres_auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth_service
      POSTGRES_PASSWORD: ${SHOP_SERVICE_PASSWORD}
      POSTGRES_DB: auth_db
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - shop_auth_backend

  postgres_auth_standby:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -s "$$PGDATA/PG_VERSION" ]; then
          export PGPASSWORD='ReplicaPass2026!'
          pg_basebackup -h postgres_auth -p 5432 -U replicator_auth -D "$$PGDATA" -Fp -Xs -P -R
        fi
        exec docker-entrypoint.sh postgres
    volumes:
      - auth_postgres_standby_data:/var/lib/postgresql/data
    depends_on:
      postgres_auth:
        condition: service_healthy
      firewall_postgres_auth:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - shop_auth_backend

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - shop_cache
      - shop_api_backend

  rabbitmq:
    image: rabbitmq:3-management-alpine
    hostname: 692963e0fdf2
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_NODENAME: rabbit@692963e0fdf2
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      shop_api_backend:
        aliases:
          - "692963e0fdf2"
      consumer_backend:
        aliases:
          - "692963e0fdf2"

  rabbitmq2:
    image: rabbitmq:3-management-alpine
    hostname: rabbitmq2
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_NODENAME: rabbit@rabbitmq2
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
    volumes:
      - rabbitmq2_data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - shop_api_backend
      - consumer_backend

  rabbitmq3:
    image: rabbitmq:3-management-alpine
    hostname: rabbitmq3
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_NODENAME: rabbit@rabbitmq3
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
    volumes:
      - rabbitmq3_data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - shop_api_backend
      - consumer_backend

  auth:
    build: ./app/auth-service
    env_file:
      - .env
    environment:
      DATABASE_URL: ${AUTH_DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    ports:
      - "8081:8000"
    depends_on:
      postgres_auth:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend
      - shop_auth_backend

  
  garage:
    image: dxflrs/garage:v2.3.0
    command: ["/garage", "server"]
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_data:/var/lib/garage/data
      - garage_meta:/var/lib/garage/meta
    ports:
      - "127.0.0.1:9000:3900"
      - "127.0.0.1:3903:3903"
    healthcheck:
      test: ["CMD", "/garage", "stats", "-a"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - storage_backend

  backup:
    build: ./backup
    env_file:
      - .env
    environment:
      PGHOST_SHOP: postgres_shop
      PGPORT_SHOP: "5432"
      PGDATABASE_SHOP: ${POSTGRES_DB}
      PGUSER_SHOP: ${POSTGRES_USER}
      PGPASSWORD_SHOP: ${POSTGRES_PASSWORD}

      PGHOST_AUTH: postgres_auth
      PGPORT_AUTH: "5432"
      PGDATABASE_AUTH: auth_db
      PGUSER_AUTH: auth_service
      PGPASSWORD_AUTH: ${SHOP_SERVICE_PASSWORD}

      S3_ENDPOINT_URL: http://garage:3900
      S3_BUCKET: ${S3_BUCKET:-shop-backups}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    depends_on:
      firewall_postgres_shop:
        condition: service_healthy
      postgres_shop:
        condition: service_healthy
      postgres_auth:
        condition: service_healthy
      garage:
        condition: service_started
    restart: "no"
    networks:
      - shop_api_backend
      - shop_auth_backend
      - storage_backend

  cron:
    build: ./backup
    env_file:
      - .env
    environment:
      PGHOST_SHOP: postgres_shop
      PGPORT_SHOP: "5432"
      PGDATABASE_SHOP: ${POSTGRES_DB}
      PGUSER_SHOP: ${POSTGRES_USER}
      PGPASSWORD_SHOP: ${POSTGRES_PASSWORD}

      PGHOST_AUTH: postgres_auth
      PGPORT_AUTH: "5432"
      PGDATABASE_AUTH: auth_db
      PGUSER_AUTH: auth_service
      PGPASSWORD_AUTH: ${SHOP_SERVICE_PASSWORD}

      S3_ENDPOINT_URL: http://garage:3900
      S3_BUCKET: ${S3_BUCKET:-shop-backups}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}

      TZ: ${TZ:-Europe/Berlin}
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
    entrypoint: ["/usr/local/bin/start-cron.sh"]
    depends_on:
      firewall_postgres_shop:
        condition: service_healthy
      postgres_shop:
        condition: service_healthy
      postgres_auth:
        condition: service_healthy
      garage:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - shop_api_backend
      - shop_auth_backend
      - storage_backend

  firewall_postgres_shop:
    build: ./firewall
    environment:
      SERVICE_NAME: postgres_shop
      ALLOWED_SUBNET: 172.25.0.0/16
      FIREWALL_PORT: "5432"
    network_mode: "service:postgres_shop"
    cap_add:
      - NET_ADMIN
    depends_on:
      postgres_shop:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - 'iptables -C INPUT -p tcp -s "$${ALLOWED_SUBNET}" --dport "$${FIREWALL_PORT}" -j ACCEPT'
      interval: 3s
      timeout: 3s
      retries: 10

  firewall_postgres_auth:
    build: ./firewall
    environment:
      SERVICE_NAME: postgres_auth
      ALLOWED_SUBNET: 172.23.0.0/16
      FIREWALL_PORT: "5432"
    network_mode: "service:postgres_auth"
    cap_add:
      - NET_ADMIN
    depends_on:
      postgres_auth:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - 'iptables -C INPUT -p tcp -s "$${ALLOWED_SUBNET}" --dport "$${FIREWALL_PORT}" -j ACCEPT'
      interval: 3s
      timeout: 3s
      retries: 10

  firewall_redis:
    build: ./firewall
    environment:
      SERVICE_NAME: redis
      ALLOWED_SUBNETS: "172.24.0.0/16,172.25.0.0/16"
      FIREWALL_PORT: "6379"
    network_mode: "service:redis"
    cap_add:
      - NET_ADMIN
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - 'iptables -C INPUT -p tcp -s 172.24.0.0/16 --dport 6379 -j ACCEPT && iptables -C INPUT -p tcp -s 172.25.0.0/16 --dport 6379 -j ACCEPT'
      interval: 3s
      timeout: 3s
      retries: 10


volumes:
  shop_postgres_data:
  shop_postgres_standby_data:
  shop_postgres_standby_data2:
  auth_postgres_data:
  redis_data:
  rabbitmq_data:
  garage_data:
  garage_meta:
  auth_postgres_standby_data:
  rabbitmq2_data:
  rabbitmq3_data:

networks:
  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
          gateway: 172.21.0.1
  

  shop_api_backend:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.25.0.0/16
          gateway: 172.25.0.1

  shop_auth_backend:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.23.0.0/16
          gateway: 172.23.0.1

  shop_cache:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.24.0.0/16
          gateway: 172.24.0.1

  consumer_backend:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.26.0.0/16
          gateway: 172.26.0.1

  storage_backend:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1