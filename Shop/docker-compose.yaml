name: shop

services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8080:8000"
    env_file: .env
    depends_on:
      postgres_shop:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend
      - shop_cache
      - shop_api_backend

  consumer:
    build: .
    command: python -m app.messaging.consumer
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - consumer_backend

  postgres_shop:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SHOP_SERVICE_PASSWORD: ${SHOP_SERVICE_PASSWORD}
    volumes:
      - shop_postgres_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - shop_api_backend

  postgres_auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth_service
      POSTGRES_PASSWORD: ${SHOP_SERVICE_PASSWORD}
      POSTGRES_DB: auth_db
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - shop_auth_backend

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - shop_cache
      - shop_api_backend

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - shop_api_backend
      - consumer_backend

  auth:
    build: ./app/auth-service
    env_file:
      - .env
    environment:
      DATABASE_URL: ${AUTH_DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    ports:
      - "8081:8000"
    depends_on:
      postgres_auth:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend
      - shop_auth_backend

  
  garage:
    image: dxflrs/garage:v2.3.0
    command: ["/garage", "server"]
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_data:/var/lib/garage/data
      - garage_meta:/var/lib/garage/meta
    ports:
      - "127.0.0.1:9000:3900"
      - "127.0.0.1:3903:3903"
    healthcheck:
      test: ["CMD", "/garage", "stats", "-a"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - storage_backend

  backup:
    build: ./backup
    env_file:
      - .env
    environment:
      PGHOST_SHOP: postgres_shop
      PGPORT_SHOP: "5432"
      PGDATABASE_SHOP: ${POSTGRES_DB}
      PGUSER_SHOP: ${POSTGRES_USER}
      PGPASSWORD_SHOP: ${POSTGRES_PASSWORD}

      PGHOST_AUTH: postgres_auth
      PGPORT_AUTH: "5432"
      PGDATABASE_AUTH: auth_db
      PGUSER_AUTH: auth_service
      PGPASSWORD_AUTH: ${SHOP_SERVICE_PASSWORD}

      S3_ENDPOINT_URL: http://garage:3900
      S3_BUCKET: ${S3_BUCKET:-shop-backups}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    depends_on:
      postgres_shop:
        condition: service_healthy
      postgres_auth:
        condition: service_healthy
      garage:
        condition: service_started
    restart: "no"
    networks:
      - shop_api_backend
      - shop_auth_backend
      - storage_backend

  cron:
    build: ./backup
    env_file:
      - .env
    environment:
      PGHOST_SHOP: postgres_shop
      PGPORT_SHOP: "5432"
      PGDATABASE_SHOP: ${POSTGRES_DB}
      PGUSER_SHOP: ${POSTGRES_USER}
      PGPASSWORD_SHOP: ${POSTGRES_PASSWORD}

      PGHOST_AUTH: postgres_auth
      PGPORT_AUTH: "5432"
      PGDATABASE_AUTH: auth_db
      PGUSER_AUTH: auth_service
      PGPASSWORD_AUTH: ${SHOP_SERVICE_PASSWORD}

      S3_ENDPOINT_URL: http://garage:3900
      S3_BUCKET: ${S3_BUCKET:-shop-backups}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}

      TZ: ${TZ:-Europe/Berlin}
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
    entrypoint: ["/usr/local/bin/start-cron.sh"]
    depends_on:
      postgres_shop:
        condition: service_healthy
      postgres_auth:
        condition: service_healthy
      garage:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - shop_api_backend
      - shop_auth_backend
      - storage_backend


volumes:
  shop_postgres_data:
  auth_postgres_data:
  redis_data:
  rabbitmq_data:
  garage_data:
  garage_meta:


networks:
  frontend:
    driver: bridge

  shop_api_backend:
    driver: bridge
    internal: true

  shop_auth_backend:
    driver: bridge
    internal: true

  shop_cache:
    driver: bridge
    internal: true

  consumer_backend:
    driver: bridge
    internal: true

  storage_backend:
    driver: bridge
    internal: true